<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog Clock | Faiza Ali</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <a href="../../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>

  <div class="clock-container">
    <div class="clock">
      <!-- Clock Hands -->
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
      <div class="hand second" id="secondHand"></div>

      <!-- Center Dot -->
      <div class="center-dot"></div>

      <!-- Clock Numbers -->
      <div class="number number-12">12</div>
      <div class="number number-3">3</div>
      <div class="number number-6">6</div>
      <div class="number number-9">9</div>
      
      <!-- Tick Marks (Optional for detail) -->
      <div class="ticks" id="ticks"></div>
    </div>

    <!-- Digital Time below clock -->
    <div class="digital-time" id="digitalTime">00:00:00</div>
    <p class="date" id="dateDisplay">Date</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
