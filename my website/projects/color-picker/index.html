<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Picker App | Faiza Ali</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <a href="../../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>

  <div class="app-container">
    <header class="header">
      <h1><i class="fas fa-palette"></i> Color Palette Generator</h1>
      <p>Generate, customize & save beautiful colors</p>
    </header>

    <!-- Main Color Display -->
    <div class="main-color-box" id="mainColorBox" style="background-color: #6c63ff;">
      <div class="color-info">
        <h2 id="mainHex">#6C63FF</h2>
        <p id="mainRgb">RGB: 108, 99, 255</p>
      </div>
      <div class="action-btns">
        <button class="btn-copy" onclick="copyToClipboard('mainHex')"><i class="fas fa-copy"></i> Copy HEX</button>
        <button class="btn-save" onclick="saveColor()"><i class="fas fa-bookmark"></i> Save</button>
      </div>
    </div>

    <!-- Generate Button -->
    <button class="btn-generate" onclick="generateRandomColor()">
      <i class="fas fa-random"></i> Generate Random Color
    </button>

    <!-- Manual Picker Section -->
    <div class="picker-section">
      <label for="colorInput">Or Pick Your Own Color:</label>
      <input type="color" id="colorInput" value="#6c63ff" />
    </div>

    <!-- Saved Colors Section -->
    <div class="saved-section">
      <div class="saved-header">
        <h3><i class="fas fa-bookmark"></i> Saved Colors</h3>
        <button class="btn-clear" onclick="clearSavedColors()">Clear All</button>
      </div>
      <div class="saved-grid" id="savedGrid">
        <p class="empty-msg" id="emptyMsg">No colors saved yet.</p>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
      <i class="fas fa-check-circle"></i> <span id="toastMsg">Copied!</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
