<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App | Faiza Ali</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <div class="app-container">
    <a href="../../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>

    <div class="weather-card">
      <!-- Search Section -->
      <div class="search-section">
        <input type="text" id="cityInput" placeholder="Enter city name (e.g. Karachi, London)" />
        <button id="searchBtn"><i class="fas fa-search"></i></button>
      </div>

      <!-- Error Message -->
      <div id="errorMsg" class="error-msg">City not found. Please try again.</div>

      <!-- Loading Spinner -->
      <div id="loader" class="loader"></div>

      <!-- Weather Info -->
      <div id="weatherInfo" class="weather-info">
        <div class="location">
          <h2 id="cityName">Karachi, Pakistan</h2>
          <p id="currentDate">Monday, 1 Jan 2024</p>
        </div>

        <div class="weather-main">
          <div class="weather-icon">
            <i class="fas fa-sun" id="mainIcon"></i>
          </div>
          <div class="weather-temp">
            <h1 id="temp">30<span>°C</span></h1>
            <p id="condition">Clear Sky</p>
          </div>
        </div>

        <div class="weather-details">
          <div class="detail-box">
            <i class="fas fa-temperature-low"></i>
            <div>
              <p>Feels Like</p>
              <h3 id="feelsLike">32°C</h3>
            </div>
          </div>
          <div class="detail-box">
            <i class="fas fa-tint"></i>
            <div>
              <p>Humidity</p>
              <h3 id="humidity">60%</h3>
            </div>
          </div>
          <div class="detail-box">
            <i class="fas fa-wind"></i>
            <div>
              <p>Wind Speed</p>
              <h3 id="windSpeed">15 km/h</h3>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
