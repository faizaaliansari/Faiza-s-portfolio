<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Stickers | Faiza Ali</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <a href="../../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>

  <div class="app-container">
    <header class="header">
      <h1>Emoji <span>Stickers</span> 😎</h1>
      <p>Click any emoji to copy it instantly!</p>
    </header>

    <!-- Search Bar -->
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search emojis (e.g., happy, cat, food)..." />
    </div>

    <!-- Category Filters -->
    <div class="categories" id="categories">
      <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
      <button class="cat-btn" onclick="filterCategory('smileys', this)">Smileys</button>
      <button class="cat-btn" onclick="filterCategory('animals', this)">Animals</button>
      <button class="cat-btn" onclick="filterCategory('food', this)">Food</button>
      <button class="cat-btn" onclick="filterCategory('activities', this)">Activities</button>
      <button class="cat-btn" onclick="filterCategory('objects', this)">Objects</button>
    </div>

    <!-- Emoji Grid -->
    <div class="emoji-grid" id="emojiGrid">
      <!-- Emojis will be injected by JS -->
    </div>

    <div class="no-results" id="noResults" style="display: none;">
      <i class="fas fa-sad-tear"></i>
      <p>No emojis found. Try a different search!</p>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <span id="toastEmoji" style="font-size: 1.5rem;">😎</span>
    <span id="toastMsg">Copied to clipboard!</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
