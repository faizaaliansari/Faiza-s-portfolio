<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe | Faiza Ali</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <div class="app-container">
    <a href="../../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>

    <div class="game-card">
      <header class="game-header">
        <h1><i class="fas fa-gamepad"></i> Tic Tac Toe</h1>
        <p>Challenge a friend or play against the computer!</p>
      </header>

      <!-- Mode Selection -->
      <div class="mode-selection">
        <button class="mode-btn active" id="pvpBtn" onclick="setMode('pvp')">
          <i class="fas fa-users"></i> 2 Players
        </button>
        <button class="mode-btn" id="aiBtn" onclick="setMode('ai')">
          <i class="fas fa-robot"></i> vs Computer
        </button>
      </div>

      <!-- Scoreboard -->
      <div class="scoreboard">
        <div class="score-box player-x">
          <span class="player-label">Player X</span>
          <span class="score" id="scoreX">0</span>
        </div>
        <div class="score-box draws">
          <span class="player-label">Draws</span>
          <span class="score" id="scoreDraws">0</span>
        </div>
        <div class="score-box player-o">
          <span class="player-label" id="playerOLabel">Player O</span>
          <span class="score" id="scoreO">0</span>
        </div>
      </div>

      <!-- Game Status -->
      <div class="status" id="status">Player X's Turn</div>

      <!-- Game Board -->
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>

      <!-- Restart Button -->
      <button class="btn-restart" onclick="resetGame()">
        <i class="fas fa-redo"></i> New Game
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
